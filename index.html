<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG BROTHER — Purchase Payment History Supabase DEV</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1f2937;font-family:Inter,Arial,sans-serif}:root{--blue:#174a91;--line:#dce4ee;--muted:#6b7280}.page{max-width:1550px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}h1{margin:0;color:var(--blue);font-size:28px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #173a6610;padding:17px;margin-bottom:15px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat .k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat .v{font-size:20px;font-weight:900;color:#22354d;margin-top:4px}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}button{cursor:pointer;font-weight:800;border-radius:8px;padding:10px 14px}.secondary{border:1px solid var(--line);background:#fff;color:#334155}.status{background:#eef4fb;border:1px solid #d9e5f3;color:#405d7d;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:12px}.status.success{background:#eef9f3;border-color:#c9ead9;color:#176c4a}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:1300px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}th{background:#f8fafc;color:#475569;position:sticky;top:0}.method{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4fb;color:#174a91;font-size:11px;font-weight:800}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#e8f7ef;color:#168652;font-weight:900;font-size:11px}@media(max-width:1000px){.filters,.summary{grid-template-columns:1fr 1fr}}@media(max-width:600px){.filters,.summary{grid-template-columns:1fr}.page{padding:12px}}</style></head><body><div class="page"><div class="top"><div><h1>Purchase Payment History</h1><div class="sub">BIG BROTHER — Supabase DEV Supplier Payment Records</div></div><div><span class="pill">Secure Supabase DEV</span> <button class="secondary" id="refreshBtn">Refresh</button></div></div><div class="summary"><div class="stat"><div class="k">Payment Count</div><div class="v" id="countStat">0</div></div><div class="stat"><div class="k">Total Paid USD</div><div class="v" id="usdStat">$0.00</div></div><div class="stat"><div class="k">Total Paid KHR</div><div class="v" id="khrStat">0 ៛</div></div><div class="stat"><div class="k">Clients Paid</div><div class="v" id="clientStat">0</div></div></div><div class="card"><div id="status" class="status">Connecting...</div><div class="filters"><div><label>Search</label><input id="search" placeholder="Payment ID / Purchase ID / Client / Transaction ID"></div><div><label>From Date</label><input id="fromDate" type="date"></div><div><label>To Date</label><input id="toDate" type="date"></div><div><label>Payment Method</label><select id="methodFilter"><option value="">All</option><option>Cash</option><option>Bank</option><option>Paid</option></select></div><button class="secondary" id="clearBtn">Clear</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Payment ID</th><th>Payment Date</th><th>Purchase ID</th><th>Client</th><th>Method</th><th>Bank</th><th>Transaction ID</th><th>Currency</th><th>Amount</th><th>Processed By</th><th>Note</th><th>Created At</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div><script>'use strict';const URL='https://sjfhlaclgmkwwofzstok.supabase.co',KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';let session=null,payments=[],lastRevision='';const $=id=>document.getElementById(id),num=v=>Number.isFinite(Number(v))?Number(v):0,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function money(v,c='USD'){const n=num(v);return String(c).toUpperCase()==='KHR'?n.toLocaleString('en-US',{maximumFractionDigits:0})+' ៛':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function fmtDate(v){if(!v)return'';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(v);const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[3]+'-'+mon[Number(m[2])-1]+'-'+m[1]}function setStatus(t,ok=false){$('status').textContent=t;$('status').className='status'+(ok?' success':'')}function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}function saveSession(s){session=s;if(!s)localStorage.removeItem(SESSION_KEY);else{if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}}async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(e){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||'Request failed');return d}async function refreshSession(){session=readSession();if(!session?.refresh_token)throw new Error('Please sign in from Clients Editor first.');const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});saveSession(await parse(r))}async function ensure(){session=readSession();if(!session?.access_token)throw new Error('Please sign in from Clients Editor first.');if(session.expires_at&&session.expires_at<Math.floor(Date.now()/1000)+30)await refreshSession()}async function rpc(fn,args={}){await ensure();const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});return parse(r)}async function load(){setStatus('Loading Supabase Payment History...');try{const r=await rpc('bb_purchase_payments');lastRevision=r.revision||'';payments=Array.isArray(r.data)?r.data:[];render();setStatus(payments.length+' Purchase Payment record(s) loaded.',true)}catch(e){setStatus(e.message)}}function filtered(){const q=$('search').value.trim().toLowerCase(),from=$('fromDate').value,to=$('toDate').value,m=$('methodFilter').value;return payments.filter(p=>{const hay=[p.purchasePaymentId,p.purchaseId,p.clientName,p.transactionId,p.bank,p.processedBy,p.batchPaymentId].join(' ').toLowerCase();const d=String(p.paymentDate||'').slice(0,10);return(!q||hay.includes(q))&&(!from||!d||d>=from)&&(!to||!d||d<=to)&&(!m||p.paymentMethod===m)}).sort((a,b)=>String(b.paymentDate||'').localeCompare(String(a.paymentDate||''))||String(b.purchasePaymentId||'').localeCompare(String(a.purchasePaymentId||'')))}function render(){const rows=filtered();$('tbody').innerHTML=rows.length?rows.map(p=>`<tr><td><strong>${esc(p.purchasePaymentId)}</strong></td><td>${esc(fmtDate(p.paymentDate))}</td><td>${esc(p.purchaseId)}</td><td>${esc(p.clientName)}</td><td><span class="method">${esc(p.paymentMethod||'—')}</span></td><td>${esc(p.bank||'—')}</td><td>${esc(p.transactionId||'—')}</td><td>${esc(p.currency)}</td><td><strong>${money(p.amount,p.currency)}</strong></td><td>${esc(p.processedBy||'—')}</td><td>${esc(p.note||'—')}</td><td>${esc(fmtDate(p.createdAt)||'—')}</td></tr>`).join(''):'<tr><td colspan="12">No Purchase Payment records found.</td></tr>';const usd=rows.filter(p=>p.currency==='USD').reduce((s,p)=>s+num(p.amount),0),khr=rows.filter(p=>p.currency==='KHR').reduce((s,p)=>s+num(p.amount),0);$('countStat').textContent=rows.length;$('usdStat').textContent=money(usd,'USD');$('khrStat').textContent=money(khr,'KHR');$('clientStat').textContent=new Set(rows.map(p=>p.clientId)).size}function clear(){[$('search'),$('fromDate'),$('toDate'),$('methodFilter')].forEach(x=>x.value='');render()}$('refreshBtn').addEventListener('click',load);$('clearBtn').addEventListener('click',clear);$('search').addEventListener('input',render);['fromDate','toDate','methodFilter'].forEach(id=>$(id).addEventListener('change',render));load();setInterval(async()=>{try{const r=await rpc('bb_purchase_payments');if(lastRevision&&r.revision!==lastRevision)load()}catch(e){}},20000);</script></body></html>

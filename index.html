<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Purchase Payment History V1.1 Smart Sync Storage</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#1f2937;font-family:Inter,Arial,sans-serif}
:root{--blue:#174a91;--line:#dce4ee;--muted:#6b7280}
.page{max-width:1550px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
h1{margin:0;color:var(--blue);font-size:28px}.sub{font-size:13px;color:var(--muted);margin-top:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #173a6610;padding:17px;margin-bottom:15px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:15px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.stat .v{font-size:20px;font-weight:900;color:#22354d;margin-top:4px}
.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}
button{cursor:pointer;font-weight:800;border-radius:8px;padding:10px 14px}
.secondary{border:1px solid var(--line);background:#fff;color:#334155}
.status{background:#eef4fb;border:1px solid #d9e5f3;color:#405d7d;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:12px}
.status.success{background:#eef9f3;border-color:#c9ead9;color:#176c4a}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1300px}
th,td{padding:10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}
th{background:#f8fafc;color:#475569;position:sticky;top:0}
.method{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4fb;color:#174a91;font-size:11px;font-weight:800}
@media(max-width:1000px){.filters,.summary{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.filters,.summary{grid-template-columns:1fr}.page{padding:12px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Purchase Payment History</h1>
      <div class="sub">BIG BROTHER — Supplier Payment Records</div>
    </div>
    <button class="secondary" onclick="loadPayments()">Refresh</button>
  </div>

  <div class="summary">
    <div class="stat"><div class="k">Payment Count</div><div class="v" id="countStat">0</div></div>
    <div class="stat"><div class="k">Total Paid USD</div><div class="v" id="usdStat">$0.00</div></div>
    <div class="stat"><div class="k">Total Paid KHR</div><div class="v" id="khrStat">0 ៛</div></div>
    <div class="stat"><div class="k">Clients Paid</div><div class="v" id="clientStat">0</div></div>
  </div>

  <div class="card">
    <div id="status" class="status">Loading Purchase Payment History...</div>

    <div class="filters">
      <div>
        <label>Search</label>
        <input id="search" placeholder="Payment ID / Purchase ID / Client / Transaction ID" oninput="render()">
      </div>
      <div>
        <label>From Date</label>
        <input id="fromDate" type="date" onchange="render()">
      </div>
      <div>
        <label>To Date</label>
        <input id="toDate" type="date" onchange="render()">
      </div>
      <div>
        <label>Payment Method</label>
        <select id="methodFilter" onchange="render()">
          <option value="">All</option>
          <option value="Cash">Cash</option>
          <option value="Bank">Bank</option>
        </select>
      </div>
      <button class="secondary" onclick="clearFilters()">Clear</button>
    </div>
  </div>

  <div class="card">
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Payment ID</th>
            <th>Payment Date</th>
            <th>Purchase ID</th>
            <th>Client</th>
            <th>Method</th>
            <th>Bank</th>
            <th>Transaction ID</th>
            <th>Currency</th>
            <th>Amount</th>
            <th>Processed By</th>
            <th>Note</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="12">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const PURCHASE_DATABASE_API_URL="https://script.google.com/macros/s/AKfycbz7k1iBBfx9xiIKl1719W_jsKA8kLl7ihD4UykIyIAk-btXvAiOsORiw71NWwUD6XFOgg/exec";
let payments=[];

const PAYMENT_HISTORY_CACHE_KEY="BB_PURCHASE_PAYMENT_HISTORY_CACHE_V1";
const PAYMENT_HISTORY_SYNC_INTERVAL_MS=20000;

let paymentHistoryRevision="";
let paymentHistorySyncBusy=false;
let paymentHistorySyncTimer=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function money(v,c="USD"){const n=num(v);return String(c).toUpperCase()==="KHR"?n.toLocaleString("en-US",{maximumFractionDigits:0})+" ៛":"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function setStatus(m,t=""){const e=document.getElementById("status");e.textContent=m;e.className="status"+(t?" "+t:"");}
function arrayOf(r){if(Array.isArray(r))return r;if(Array.isArray(r?.data))return r.data;return [];}


function formatDateOnly(value){
  if(!value) return "";

  if(value instanceof Date && !isNaN(value)){
    return String(value.getDate()).padStart(2,"0")+"/"+
      String(value.getMonth()+1).padStart(2,"0")+"/"+
      value.getFullYear();
  }

  const s=String(value).trim();

  const iso=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(iso){
    return String(iso[3]).padStart(2,"0")+"/"+
      String(iso[2]).padStart(2,"0")+"/"+
      iso[1];
  }

  const d=new Date(s);
  if(!isNaN(d)){
    return String(d.getDate()).padStart(2,"0")+"/"+
      String(d.getMonth()+1).padStart(2,"0")+"/"+
      d.getFullYear();
  }

  return s
    .replace(/\s+\d{1,2}:\d{2}:\d{2}.*$/,"")
    .replace(/\s+GMT[+-]\d{4}.*$/,"");
}

function readPaymentHistoryCache(){
  try{
    const raw=localStorage.getItem(PAYMENT_HISTORY_CACHE_KEY);
    if(!raw) return null;

    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.payments)) return null;

    return parsed;
  }catch(_){
    return null;
  }
}

function savePaymentHistoryCache(revision){
  try{
    const payload={
      revision:String(revision||paymentHistoryRevision||""),
      savedAt:Date.now(),
      payments:Array.isArray(payments)?payments:[]
    };

    localStorage.setItem(PAYMENT_HISTORY_CACHE_KEY,JSON.stringify(payload));

    if(payload.revision){
      paymentHistoryRevision=payload.revision;
    }
  }catch(error){
    console.warn("Purchase Payment History cache unavailable:",error);
  }
}

function renderPaymentHistoryCache(){
  const cached=readPaymentHistoryCache();
  if(!cached) return false;

  paymentHistoryRevision=String(cached.revision||"");
  payments=cached.payments;

  render();
  setStatus("Cached • checking for updates...","success");
  return true;
}

async function fetchPaymentHistoryRevision(){
  const r=await getJson(PURCHASE_DATABASE_API_URL,{
    action:"purchaseHistoryRevision"
  });

  if(r?.success===false){
    throw new Error(r.error||"Sync check failed.");
  }

  return String(r?.revision||"0");
}

function flashPaymentHistoryStatus(text){
  setStatus(text,"success");

  clearTimeout(flashPaymentHistoryStatus.timer);
  flashPaymentHistoryStatus.timer=setTimeout(()=>{
    setStatus(payments.length+" Purchase Payment record(s) loaded.","success");
  },1800);
}

async function paymentHistorySmartSyncTick(forceCheck=false){
  if(paymentHistorySyncBusy) return;
  if(document.hidden && !forceCheck) return;

  paymentHistorySyncBusy=true;

  try{
    const revision=await fetchPaymentHistoryRevision();

    if(paymentHistoryRevision && revision===paymentHistoryRevision){
      flashPaymentHistoryStatus("Up to date • auto sync 20s");
      return;
    }

    paymentHistoryRevision=revision;
    await loadPayments({silent:true});
    flashPaymentHistoryStatus("Updated automatically");

  }catch(error){
    console.warn("Purchase Payment History smart sync failed:",error);
    // Keep current/cached data on screen and retry next cycle.
  }finally{
    paymentHistorySyncBusy=false;
  }
}

function startPaymentHistorySmartSync(){
  if(paymentHistorySyncTimer){
    clearInterval(paymentHistorySyncTimer);
  }

  paymentHistorySyncTimer=setInterval(
    ()=>paymentHistorySmartSyncTick(false),
    PAYMENT_HISTORY_SYNC_INTERVAL_MS
  );
}

function getJson(url,params={}){
  return new Promise((resolve,reject)=>{
    const cb="bbpph_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove();};
    window[cb]=d=>{cleanup();resolve(d)};
    const u=new URL(url);
    Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.set(k,v)});
    u.searchParams.set("callback",cb);u.searchParams.set("_t",Date.now());
    s.src=u.toString();s.async=true;
    s.onerror=()=>{cleanup();reject(new Error("Could not load Purchase Database."))};
    const timer=setTimeout(()=>{cleanup();reject(new Error("Purchase Database request timed out."))},15000);
    document.head.appendChild(s);
  });
}

async function loadPayments(options={}){
  const silent=options && options.silent===true;

  if(!silent){
    setStatus("Loading Purchase Payment History...");
  }

  try{
    const [r,revision]=await Promise.all([
      getJson(PURCHASE_DATABASE_API_URL,{action:"getPurchasePayments"}),
      fetchPaymentHistoryRevision().catch(()=>paymentHistoryRevision||"")
    ]);

    if(r?.success===false){
      throw new Error(r.error||"Database error.");
    }

    payments=arrayOf(r);
    paymentHistoryRevision=String(revision||paymentHistoryRevision||"");

    render();
    savePaymentHistoryCache(paymentHistoryRevision);

    if(!silent){
      setStatus(payments.length+" Purchase Payment record(s) loaded.","success");
    }

  }catch(e){
    console.error(e);

    const cached=readPaymentHistoryCache();

    if(cached){
      payments=cached.payments;
      paymentHistoryRevision=String(cached.revision||paymentHistoryRevision||"");
      render();
      setStatus("Cached Payment History shown • sync will retry automatically.","success");
      return;
    }

    payments=[];
    render();
    setStatus("Could not load Purchase Payment History: "+(e.message||"Database connection error."));
  }
}

function filtered(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  const method=document.getElementById("methodFilter").value;

  return payments.filter(p=>{
    const hay=[p.purchasePaymentId,p.purchaseId,p.clientName,p.transactionId,p.bank,p.processedBy].join(" ").toLowerCase();
    if(q&&!hay.includes(q))return false;
    if(from){
      const raw=String(p.paymentDate||"");
      const iso=(raw.match(/^(\d{4}-\d{2}-\d{2})/)||[])[1]||"";
      if(iso && iso<from) return false;
    }
    if(to){
      const raw=String(p.paymentDate||"");
      const iso=(raw.match(/^(\d{4}-\d{2}-\d{2})/)||[])[1]||"";
      if(iso && iso>to) return false;
    }
    if(method&&String(p.paymentMethod||"")!==method)return false;
    return true;
  }).sort((a,b)=>String(b.paymentDate||"").localeCompare(String(a.paymentDate||""))||String(b.purchasePaymentId||"").localeCompare(String(a.purchasePaymentId||"")));
}

function render(){
  const rows=filtered();
  const body=document.getElementById("tbody");

  body.innerHTML=rows.length?rows.map(p=>`
    <tr>
      <td><strong>${esc(p.purchasePaymentId)}</strong></td>
      <td>${esc(formatDateOnly(p.paymentDate))}</td>
      <td>${esc(p.purchaseId)}</td>
      <td>${esc(p.clientName)}</td>
      <td><span class="method">${esc(p.paymentMethod||"-")}</span></td>
      <td>${esc(p.bank||"-")}</td>
      <td>${esc(p.transactionId||"-")}</td>
      <td>${esc(p.currency)}</td>
      <td><strong>${money(p.amount,p.currency)}</strong></td>
      <td>${esc(p.processedBy||"-")}</td>
      <td>${esc(p.note||"-")}</td>
      <td>${esc(formatDateOnly(p.createdAt)||"-")}</td>
    </tr>`).join(""):'<tr><td colspan="12">No Purchase Payment records found.</td></tr>';

  const usd=rows.filter(x=>String(x.currency||"USD")==="USD");
  const khr=rows.filter(x=>String(x.currency||"USD")==="KHR");
  document.getElementById("countStat").textContent=rows.length;
  document.getElementById("usdStat").textContent=money(usd.reduce((s,x)=>s+num(x.amount),0),"USD");
  document.getElementById("khrStat").textContent=money(khr.reduce((s,x)=>s+num(x.amount),0),"KHR");
  document.getElementById("clientStat").textContent=new Set(rows.map(x=>x.clientId||x.clientName).filter(Boolean)).size;
}

function clearFilters(){
  document.getElementById("search").value="";
  document.getElementById("fromDate").value="";
  document.getElementById("toDate").value="";
  document.getElementById("methodFilter").value="";
  render();
}
(async function initializePurchasePaymentHistory(){
  const showedCache=renderPaymentHistoryCache();

  if(!showedCache){
    await loadPayments();
  }else{
    await paymentHistorySmartSyncTick(true);
  }

  startPaymentHistorySmartSync();
})();

document.addEventListener("visibilitychange",function(){
  if(!document.hidden){
    paymentHistorySmartSyncTick(true);
  }
});
</script>
</body>
</html>
